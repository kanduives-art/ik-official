<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IK - Ivan Kandu | Official Site</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;700&family=Inter:wght@300;400;600;800&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #ff3333;
            --primary-dark: #cc0000;
            --dark: #0a0a0a;
            --darker: #050505;
            --light: #ffffff;
            --gray: #888888;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html { scroll-behavior: smooth; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            color: var(--light);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* OVERLAY DÉMARRAGE */
        .start-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--darker);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .start-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .start-logo { font-family: 'Oswald', sans-serif; font-size: 8rem; font-weight: 700; letter-spacing: 20px; animation: pulse 2s infinite; text-shadow: 0 0 60px rgba(255,51,51,0.5); }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        .start-btn { padding: 25px 80px; background: transparent; border: 2px solid var(--primary); color: var(--primary); font-family: 'Oswald', sans-serif; font-size: 1.3rem; text-transform: uppercase; letter-spacing: 8px; cursor: pointer; transition: var(--transition); position: relative; overflow: hidden; }
        .start-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: var(--primary); transition: left 0.4s; z-index: -1; }
        .start-btn:hover::before { left: 0; }
        .start-btn:hover { color: var(--light); transform: scale(1.05); box-shadow: 0 0 40px rgba(255,51,51,0.6); }

        /* NAVIGATION */
        nav { position: fixed; top: 0; width: 100%; padding: 25px 60px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); backdrop-filter: blur(20px); transition: var(--transition); border-bottom: 1px solid transparent; }
        nav.scrolled { background: rgba(5,5,5,0.98); padding: 15px 60px; border-bottom: 1px solid rgba(255,51,51,0.3); }
        .nav-left { display: flex; align-items: center; gap: 40px; }
        .logo { font-family: 'Oswald', sans-serif; font-size: 2.2rem; font-weight: 700; letter-spacing: 8px; color: var(--light); text-decoration: none; position: relative; cursor: pointer; }
        .logo::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 100%; height: 3px; background: var(--primary); transform: scaleX(0); transition: transform 0.3s; transform-origin: right; }
        .logo:hover::after { transform: scaleX(1); transform-origin: left; }
        .nav-links { display: flex; gap: 50px; list-style: none; }
        .nav-links a { color: var(--light); text-decoration: none; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 3px; position: relative; padding: 10px 0; transition: color 0.3s; font-weight: 500; }
        .nav-links a::before { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 2px; background: var(--primary); transition: width 0.3s; }
        .nav-links a:hover::before { width: 100%; }
        .nav-links a:hover { color: var(--primary); }

        /* SÉLECTEUR DE LANGUE */
        .language-selector { position: relative; z-index: 1001; }
        .lang-toggle { width: 50px; height: 35px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; transition: var(--transition); }
        .lang-toggle:hover { background: rgba(255,255,255,0.1); border-color: var(--primary); transform: scale(1.05); }
        .lang-menu { position: absolute; top: 100%; right: 0; margin-top: 10px; background: rgba(10,10,10,0.98); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 8px; min-width: 60px; opacity: 0; visibility: hidden; transform: translateY(-10px); transition: all 0.3s; backdrop-filter: blur(20px); }
        .language-selector:hover .lang-menu { opacity: 1; visibility: visible; transform: translateY(0); }
        .lang-option { padding: 10px; border-radius: 4px; cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }
        .lang-option:hover { background: rgba(255,51,51,0.2); }

        /* HERO */
        .hero { position: relative; height: 100vh; width: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .hero-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: url('montagne.jpg') center/cover no-repeat; animation: kenburns 25s ease-in-out infinite alternate; filter: brightness(0.6) contrast(1.2) saturate(0.8); }
        @keyframes kenburns { 0% { transform: scale(1) translate(0, 0); } 100% { transform: scale(1.15) translate(-2%, -2%); } }
        .hero-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.2) 40%, rgba(0,0,0,0.95) 100%); }
        .hero-content { position: relative; z-index: 10; text-align: center; max-width: 900px; padding: 0 30px; }
        .hero-label { display: inline-block; padding: 12px 30px; border: 1px solid var(--primary); color: var(--primary); font-size: 0.9rem; letter-spacing: 6px; text-transform: uppercase; margin-bottom: 30px; animation: fadeInUp 1s ease-out; background: rgba(255,51,51,0.1); }
        .hero-title { font-family: 'Oswald', sans-serif; font-size: clamp(4rem, 12vw, 10rem); font-weight: 700; line-height: 0.9; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 30px; animation: fadeInUp 1s ease-out 0.2s both; text-shadow: 0 0 80px rgba(0,0,0,0.9); background: linear-gradient(to bottom, #fff, #888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .hero-subtitle { font-size: 1.3rem; letter-spacing: 8px; color: var(--gray); animation: fadeInUp 1s ease-out 0.4s both; font-weight: 300; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        .scroll-indicator { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); animation: bounce 2s infinite; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--gray); font-size: 0.8rem; letter-spacing: 3px; text-transform: uppercase; }
        @keyframes bounce { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(15px); } }

        /* SECTIONS COMMUNES */
        section { position: relative; overflow: hidden; padding: 120px 60px; }
        .section-header { text-align: center; margin-bottom: 80px; }
        .section-label { display: inline-block; color: var(--primary); font-size: 0.9rem; letter-spacing: 6px; text-transform: uppercase; margin-bottom: 20px; font-weight: 600; }
        .section-title { font-family: 'Oswald', sans-serif; font-size: clamp(2.5rem, 5vw, 4rem); text-transform: uppercase; letter-spacing: 15px; position: relative; display: inline-block; }
        .section-title::after { content: ''; position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); width: 80px; height: 4px; background: var(--primary); }

        /* RÉSEAUX FIXES GAUCHE */
        .socials-fixed { position: fixed; left: 40px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 20px; z-index: 999; }
        .social-link { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; color: var(--light); font-size: 1.2rem; text-decoration: none; transition: var(--transition); backdrop-filter: blur(10px); }
        .social-link:hover { background: var(--primary); border-color: var(--primary); transform: scale(1.2) translateX(10px); box-shadow: 0 0 30px rgba(255,51,51,0.4); }

        /* SINGLE PEACE FOR MY MADA */
        .single-section { min-height: 100vh; background: var(--darker); display: flex; align-items: center; position: relative; }
        .single-section::before { content: 'PEACE'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: 'Oswald', sans-serif; font-size: 20vw; font-weight: 700; color: rgba(255,51,51,0.03); letter-spacing: 50px; white-space: nowrap; pointer-events: none; z-index: 0; }
        .single-container { max-width: 1400px; margin: 0 auto; width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 100px; align-items: center; position: relative; z-index: 1; }
        .single-content { order: 2; text-align: left; }
        .single-visual { order: 1; display: flex; flex-direction: column; align-items: center; gap: 30px; }
        .single-badge { display: inline-block; padding: 10px 30px; background: var(--primary); color: var(--light); font-size: 0.9rem; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 30px; font-weight: 700; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%); }
        .single-title-large { font-family: 'Oswald', sans-serif; font-size: clamp(3rem, 6vw, 6rem); margin-bottom: 20px; letter-spacing: 10px; line-height: 1; color: var(--light); text-shadow: 0 0 60px rgba(255,51,51,0.3); }
        .single-year { font-size: 1.5rem; color: var(--primary); font-weight: 700; letter-spacing: 10px; margin-bottom: 30px; }
        .single-description { font-size: 1.2rem; line-height: 2; color: #aaa; margin-bottom: 40px; max-width: 500px; }
        
        .single-cover-large { width: 100%; max-width: 500px; aspect-ratio: 1; border-radius: 20px; overflow: hidden; position: relative; box-shadow: 0 60px 120px rgba(255,51,51,0.2); transition: var(--transition); border: 1px solid rgba(255,51,51,0.3); }
        .single-cover-large:hover { transform: scale(1.03); box-shadow: 0 80px 160px rgba(255,51,51,0.4); }
        .single-cover-large img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.7s; }
        .single-cover-large:hover img { transform: scale(1.1); }
        
        /* Boutons d'écoute rattachés à l'image */
        .single-actions-visual { display: flex; gap: 15px; justify-content: center; width: 100%; }
        
        .btn-primary, .btn-secondary { padding: 15px 30px; border-radius: 50px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; transition: var(--transition); display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-size: 0.9rem; }
        .btn-primary { background: var(--primary); color: var(--light); border: 2px solid var(--primary); }
        .btn-primary:hover { background: transparent; color: var(--primary); transform: translateY(-3px); box-shadow: 0 10px 30px rgba(255,51,51,0.3); }
        .btn-secondary { background: transparent; color: var(--light); border: 2px solid rgba(255,255,255,0.3); }
        .btn-secondary:hover { border-color: var(--light); background: rgba(255,255,255,0.1); transform: translateY(-3px); }

        /* TOURNÉE (Dates plus petites) */
        .tour-section { background: var(--darker); min-height: 80vh; display: flex; flex-direction: column; align-items: center; }
        .tour-content { text-align: center; max-width: 800px; width: 100%; }
        .tour-dates-container { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        .tour-date-card { position: relative; background: rgba(255,255,255,0.02); border: 1px solid; border-radius: 15px; padding: 20px 30px; cursor: pointer; transition: all 0.4s ease; overflow: hidden; backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: space-between; text-align: left; }
        
        /* Couleurs des dates */
        .tour-date-card.red { border-color: rgba(255,51,51,0.3); }
        .tour-date-card.blue { border-color: rgba(51,153,255,0.3); }
        .tour-date-card.gold { border-color: rgba(255,165,0,0.3); }
        .tour-date-card.green { border-color: rgba(51,255,153,0.3); }
        .tour-date-card.purple { border-color: rgba(153,51,255,0.3); }

        .tour-date-card:hover { transform: scale(1.02) translateX(10px); }
        .tour-date-card.red:hover { box-shadow: 0 0 30px rgba(255,51,51,0.3); }
        .tour-date-card.blue:hover { box-shadow: 0 0 30px rgba(51,153,255,0.3); }
        .tour-date-card.gold:hover { box-shadow: 0 0 30px rgba(255,165,0,0.3); }
        
        .date-info-left { display: flex; flex-direction: column; }
        .date-day { font-family: 'Oswald', sans-serif; font-size: 1.3rem; letter-spacing: 2px; font-weight: 700; }
        .tour-date-card.red .date-day { color: #ff3333; }
        .tour-date-card.blue .date-day { color: #3399ff; }
        .tour-date-card.gold .date-day { color: #ffa500; }
        .tour-date-card.green .date-day { color: #33ff99; }
        .tour-date-card.purple .date-day { color: #9933ff; }

        .date-venue { font-family: 'Oswald', sans-serif; font-size: 1.2rem; color: #fff; letter-spacing: 1px; }
        .date-city { font-size: 0.9rem; color: #888; letter-spacing: 2px; text-transform: uppercase; }
        
        .date-badge-special { display: inline-block; padding: 5px 15px; border-radius: 15px; font-size: 0.7rem; letter-spacing: 1px; text-transform: uppercase; font-weight: 700; }
        .tour-date-card.blue .date-badge-special { background: rgba(51,153,255,0.2); color: #3399ff; border: 1px solid rgba(51,153,255,0.3); }
        .tour-date-card.red .date-badge-special { background: rgba(255,51,51,0.2); color: #ff3333; border: 1px solid rgba(255,51,51,0.3); transition: all 0.3s; }
        .tour-date-card.red:hover .date-badge-special { background: #ff3333; color: #fff; }
        .tour-date-card.gold .date-badge-special { background: rgba(255,165,0,0.2); color: #ffa500; border: 1px solid rgba(255,165,0,0.3); }

        /* MUSIQUES */
        .music-section { background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%); }
        .music-platforms { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; max-width: 1000px; margin: 0 auto; }
        .platform-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 25px; text-align: center; transition: var(--transition); text-decoration: none; color: var(--light); min-width: 200px; flex: 1; max-width: 250px; }
        .platform-card:hover { transform: translateY(-10px); border-color: var(--primary); box-shadow: 0 15px 30px rgba(255,51,51,0.15); }
        .platform-icon { font-size: 2.5rem; margin-bottom: 15px; display: block; transition: transform 0.4s; }
        .platform-card:hover .platform-icon { transform: scale(1.1); }
        .platform-name { font-family: 'Oswald', sans-serif; font-size: 1.2rem; letter-spacing: 2px; margin-bottom: 5px; text-transform: uppercase; }
        .platform-action { font-size: 0.8rem; color: var(--gray); text-transform: uppercase; transition: color 0.3s; }
        .platform-card:hover .platform-action { color: var(--primary); }

        /* BIOGRAPHIE */
        .bio-section { background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%); }
        .bio-container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 400px 1fr; gap: 80px; align-items: center; }
        .bio-portrait { border-radius: 20px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.1); }
        .bio-portrait img { width: 100%; height: auto; display: block; transition: transform 0.7s; }
        .bio-portrait:hover img { transform: scale(1.05); }
        .bio-content h2 { font-family: 'Oswald', sans-serif; font-size: 3rem; margin-bottom: 10px; letter-spacing: 5px; }
        .bio-role { color: var(--primary); font-size: 1.1rem; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 30px; font-weight: 600; }
        .bio-text { font-size: 1rem; line-height: 2; color: #bbb; margin-bottom: 20px; text-align: justify; }
        .bio-text strong { color: var(--light); font-weight: 600; }

        /* RÉSEAUX SOCIAUX */
        .social-section { background: var(--darker); min-height: auto; }
        .social-platforms { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; max-width: 1000px; margin: 0 auto; }
        .social-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 25px 40px; text-align: center; transition: var(--transition); text-decoration: none; color: var(--light); display: flex; flex-direction: column; align-items: center; min-width: 180px; }
        .social-card-icon { font-size: 2.5rem; margin-bottom: 15px; }
        .social-card-name { font-size: 1.2rem; font-family: 'Oswald', sans-serif; letter-spacing: 2px; margin-bottom: 10px; text-transform: uppercase; }
        
        @keyframes pulseSuivre {
            0%, 100% { transform: scale(1); opacity: 0.7; color: var(--gray); }
            50% { transform: scale(1.1); opacity: 1; color: var(--primary); }
        }
        .social-card-action { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; animation: pulseSuivre 2s infinite; }
        
        .social-card.instagram:hover { border-color: #E4405F; box-shadow: 0 15px 30px rgba(228,64,95,0.2); }
        .social-card.instagram .social-card-icon { color: #E4405F; }
        .social-card.tiktok:hover { border-color: #00f2ea; box-shadow: 0 15px 30px rgba(0,242,234,0.2); }
        .social-card.tiktok .social-card-icon { color: #00f2ea; }
        .social-card.facebook:hover { border-color: #1877F2; box-shadow: 0 15px 30px rgba(24,119,242,0.2); }
        .social-card.facebook .social-card-icon { color: #1877F2; }

        /* GALERIE */
        .gallery-section { background: linear-gradient(to bottom, #0a0a0a, #111); display: flex; flex-direction: column; align-items: center; }
        .folder-wrapper { cursor: pointer; transition: var(--transition); display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .folder-wrapper:hover { transform: scale(1.05) translateY(-10px); }
        .folder-icon-container { position: relative; width: 250px; height: 180px; }
        .folder-back { position: absolute; bottom: 0; left: 0; width: 100%; height: 150px; background: #222; border-radius: 15px; border: 2px solid #333; }
        .folder-paper1 { position: absolute; bottom: 10px; left: 10%; width: 80%; height: 140px; background: #fff; border-radius: 10px; transform: rotate(-5deg); transition: var(--transition); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .folder-paper2 { position: absolute; bottom: 10px; left: 10%; width: 80%; height: 140px; background: #ccc; border-radius: 10px; transform: rotate(5deg); transition: var(--transition); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .folder-front { position: absolute; bottom: 0; left: 0; width: 100%; height: 120px; background: var(--primary); border-radius: 15px 15px 10px 10px; box-shadow: 0 10px 30px rgba(255,51,51,0.4); display: flex; align-items: center; justify-content: center; font-size: 3rem; color: rgba(255,255,255,0.5); transition: var(--transition); transform-origin: bottom; }
        
        .folder-wrapper:hover .folder-paper1 { transform: rotate(-15deg) translateY(-20px); }
        .folder-wrapper:hover .folder-paper2 { transform: rotate(15deg) translateY(-15px); }
        .folder-wrapper:hover .folder-front { transform: rotateX(20deg); }
        
        .folder-text { font-family: 'Oswald', sans-serif; font-size: 1.5rem; letter-spacing: 3px; text-transform: uppercase; color: var(--light); }

        .gallery-modal { position: fixed; inset: 0; background: rgba(5,5,5,0.98); z-index: 10000; display: none; opacity: 0; transition: opacity 0.4s; overflow-y: auto; padding: 50px; }
        .gallery-modal.active { display: block; opacity: 1; }
        .gallery-modal-close { position: absolute; top: 30px; right: 40px; font-size: 2.5rem; color: #fff; cursor: pointer; transition: color 0.3s; z-index: 10001; }
        .gallery-modal-close:hover { color: var(--primary); }
        .gallery-grid-inner { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; max-width: 1400px; margin: 50px auto 0; }
        .gallery-item-inner { border-radius: 15px; overflow: hidden; aspect-ratio: 1; background: #222; border: 1px solid rgba(255,255,255,0.1); }
        .gallery-item-inner img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; cursor: pointer; }
        .gallery-item-inner:hover img { transform: scale(1.1); }

        #ikbot-container { position: fixed; bottom: 30px; right: 30px; z-index: 9999; display: flex; flex-direction: row; align-items: flex-end; gap: 15px; }
        #ikbot-bubble { background: var(--light); color: var(--darker); padding: 15px 25px; border-radius: 20px 20px 0 20px; max-width: 280px; font-size: 0.95rem; font-weight: 600; box-shadow: 0 15px 30px rgba(0,0,0,0.6); opacity: 0; transform: scale(0.8) translateY(20px); transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; position: relative; border: 2px solid var(--primary); }
        #ikbot-bubble::after { content: ''; position: absolute; bottom: 0; right: -10px; border-width: 10px 0 0 10px; border-style: solid; border-color: transparent transparent transparent var(--light); }
        #ikbot-bubble.show { opacity: 1; transform: scale(1) translateY(0); }
        #ikbot-avatar { width: 70px; height: 70px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Oswald', sans-serif; font-size: 1.8rem; font-weight: 700; color: #fff; box-shadow: 0 10px 25px rgba(255,51,51,0.5); border: 3px solid #fff; animation: floatBot 4s ease-in-out infinite; cursor: help; }
        @keyframes floatBot { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); box-shadow: 0 20px 35px rgba(255,51,51,0.6); } }

        /* NEWSLETTER */
        .newsletter-section { background: linear-gradient(to bottom, var(--darker), #000); text-align: center; }
        .newsletter-content { max-width: 700px; margin: 0 auto; }
        .newsletter-title { font-family: 'Oswald', sans-serif; font-size: 3rem; margin-bottom: 20px; letter-spacing: 5px; }
        .newsletter-subtitle { color: var(--gray); font-size: 1.1rem; margin-bottom: 40px; }
        .newsletter-form-premium { display: flex; gap: 15px; margin-bottom: 20px; }
        .newsletter-input-premium { flex: 1; padding: 20px 30px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 50px; color: var(--light); font-size: 1rem; outline: none; transition: var(--transition); }
        .newsletter-input-premium:focus { border-color: var(--primary); background: rgba(255,255,255,0.1); }
